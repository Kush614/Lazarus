<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAZARUS Proof Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10;--panel:#12161B;--panel2:#171C22;--border:#232A33;--border2:#2E3742;
  --text:#F2F4F7;--text-2:#A9B4C2;--accent:#5B8CFF;--ok:#3DDC97;--warn:#F5C451;--bad:#FF6B6B;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:14px}

/* header */
.hdr{border-bottom:1px solid var(--border);background:var(--bg)}
.top{display:flex;align-items:center;gap:20px;padding:14px 24px 6px;flex-wrap:wrap}
.navrow{display:flex;align-items:center;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.navtab{height:44px;padding:0 12px;font-size:15px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.navtab:hover{color:var(--text)}
.navtab[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.navsep{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);padding:0 6px 0 18px;margin-left:8px;border-left:1px solid var(--border2);white-space:nowrap}
.brand{font-weight:600;font-size:18px;letter-spacing:.14em}
.pitch{color:var(--text-2);font-size:15px;flex:1;min-width:220px}
.activity{color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity[hidden]{display:none}
.activity .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em;border:1px solid var(--border2);white-space:nowrap}
.pill.live{color:var(--ok);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.08)}
.pill.off{color:var(--warn);border-color:rgba(245,196,81,.45);background:rgba(245,196,81,.08)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.hbtn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:500;background:var(--panel)}
.hbtn:hover{border-color:var(--text-2)}

/* layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr) 400px;transition:grid-template-columns .3s ease}
.app.chat-closed{grid-template-columns:268px minmax(0,1fr) 0}
.app.chat-closed .chat{visibility:hidden}

/* stepper */
.stepper{border-right:1px solid var(--border);padding:24px 16px;overflow:auto}
.stepper h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);padding:0 10px 12px}
.steps{list-style:none;display:flex;flex-direction:column;gap:4px;position:relative}
.sbtn{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:var(--r);border:1px solid transparent;transition:background .2s,border-color .2s}
.sbtn:hover{background:var(--panel)}
.sbtn[aria-current="step"]{background:var(--panel);border-color:rgba(91,140,255,.55);box-shadow:inset 3px 0 var(--accent)}
.sbtn .num{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;border:1px solid var(--border2);color:var(--text)}
.sbtn[aria-current="step"] .num{background:var(--accent);border-color:var(--accent);color:#0B0D10}
.sbtn .st{font-size:15px;font-weight:600;color:var(--text)}
.sbtn .ss{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.ss i{width:8px;height:8px;border-radius:50%;background:var(--text-2);flex:none}
.ss.s-done{color:var(--ok)}.ss.s-done i{background:var(--ok)}
.ss.s-waiting{color:var(--warn)}.ss.s-waiting i{background:var(--warn)}
.ss.s-blocked{color:var(--bad)}.ss.s-blocked i{background:var(--bad)}
.walk{margin:20px 10px 0;width:calc(100% - 20px)}

/* main */
.main{overflow:auto;padding:32px 40px 40px;min-width:0}
.panel{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.panel.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.panel h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin-top:6px}
.lead{font-size:18px;color:var(--text);max-width:68ch}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .sub{color:var(--text-2);font-size:14px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.04em;border:1px solid var(--border2);color:var(--text-2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(61,220,151,.45)}
.tag.warn{color:var(--warn);border-color:rgba(245,196,81,.45)}
.tag.bad{color:var(--bad);border-color:rgba(255,107,107,.5)}
.tag.acc{color:var(--accent);border-color:rgba(91,140,255,.5)}
.tag.sample{color:var(--warn);border-color:rgba(245,196,81,.45);text-transform:uppercase}

/* flow diagram */
.flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px 0}
.node{flex:1 1 0;min-width:112px;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.node b{font-size:14px;font-weight:600}
.node span{font-size:12px;color:var(--text-2);line-height:1.4}
.node.k-agent{border-color:rgba(91,140,255,.55)}
.node.k-ok{border-color:rgba(61,220,151,.55)}.node.k-ok b{color:var(--ok)}
.node.k-bad{border-color:rgba(255,107,107,.55)}.node.k-bad b{color:var(--bad)}
.node.k-chain{border-color:rgba(245,196,81,.5)}
.arr{flex:0 0 34px;display:grid;place-items:center;color:var(--text-2)}
.arr svg{width:26px;height:14px}
.arr path{stroke:currentColor;stroke-width:1.6;fill:none;stroke-dasharray:30;stroke-dashoffset:0}
.flow.play .node{animation:pop .45s ease both;animation-delay:calc(var(--i) * 220ms)}
.flow.play .arr path{animation:draw .4s ease both;animation-delay:calc(var(--i) * 220ms + 120ms)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}

/* data */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 18px;font-size:15px}
.kv dt{color:var(--text-2)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.metric{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px}
.metric .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.metric .v small{font-size:14px;color:var(--text-2);font-weight:500;margin-left:4px}
.metric .l{font-size:13px;color:var(--text-2);margin-top:2px}
.metric.ok .v{color:var(--ok)}.metric.warn .v{color:var(--warn)}.metric.bad .v{color:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0;padding-top:4px}
.li .t{font-size:15px;overflow-wrap:anywhere}
.li .t.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .m{font-size:13px;color:var(--text-2);grid-column:1/-1;overflow-wrap:anywhere}
.li .m .mono{font-size:13px}
.linkbtn{color:var(--accent);font-size:14px;font-weight:500;padding:6px 0}
.waiting{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px dashed rgba(245,196,81,.45);border-radius:10px;background:rgba(245,196,81,.05)}
.waiting b{color:var(--warn);font-weight:600}
.waiting p{color:var(--text-2);font-size:14px;margin-top:2px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(245,196,81,.3);border-top-color:var(--warn);animation:spin 1s linear infinite;flex:none;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .6s ease}
.bar.bad i{background:var(--bad)}
.vtable{width:100%;border-collapse:collapse;font-size:14px}
.vtable th{text-align:left;font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;padding:0 12px 10px 0;border-bottom:1px solid var(--border)}
.vtable td{padding:12px 12px 12px 0;border-bottom:1px solid var(--border);vertical-align:top}
.vtable tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* verify */
.verify{border-color:rgba(91,140,255,.4)}
.vrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vrow .sub{margin:0;flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:9px;font-size:15px;font-weight:600;border:1px solid var(--border2);background:var(--panel2);color:var(--text);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B0D10}
.btn.primary:hover:not(:disabled){background:#7AA2FF}
.btn:disabled{opacity:1;background:var(--panel2);border-color:var(--border2);color:var(--text-2)}
.btn .spin{border-color:rgba(11,13,16,.3);border-top-color:#0B0D10;margin:0;width:16px;height:16px}
.result{margin-top:16px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);padding:16px 18px;animation:enter .3s ease both}
.result.ok{border-color:rgba(61,220,151,.5)}
.result.bad{border-color:rgba(255,107,107,.55)}
.result.warn{border-color:rgba(245,196,81,.5)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhead b{font-size:15px}
.rhead .when{color:var(--text-2);font-size:13px;margin-left:auto}
.check{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--border);align-items:start}
.check:first-of-type{border-top:0}
.check .n{font-weight:600;font-size:15px}
.check .d{grid-column:2;font-size:14px;color:var(--text-2);overflow-wrap:anywhere}
.check .tag{grid-row:span 2;justify-content:center}
.rnote{font-size:14px;color:var(--text-2);margin-top:10px}
details.raw{margin-top:12px}
details.raw summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
pre.code{margin-top:8px;font:400 13px/1.6 var(--mono);color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border:1px solid var(--border2);border-radius:8px;overflow:hidden;min-width:0;background:var(--panel)}
.pane .ph{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;gap:8px}
.pane pre{font:400 13px/1.6 var(--mono);padding:10px 0;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.pane pre div{padding:0 12px}
.pane pre .hit{background:rgba(255,107,107,.12);box-shadow:inset 3px 0 var(--bad)}
.pane p{padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.hunt-in{display:flex;flex-direction:column;gap:10px}
.hunt-in textarea{width:100%;min-height:76px;resize:vertical;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;font:400 14px/1.5 var(--mono);color:var(--text)}
.hunt-in textarea:focus{outline:none;border-color:var(--accent)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border2);font-size:13px;color:var(--text);background:var(--panel2);font-family:var(--mono)}
.chipbtn:hover{border-color:var(--accent)}

.stepnav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}
.stepnav .hint{color:var(--text-2);font-size:13px;align-self:center;text-align:center}

/* chat */
.chat{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);position:relative;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.chat-h b{font-size:16px;font-weight:600;flex:1}
.cbtn{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border2);font-size:13px;font-weight:500;color:var(--text)}
.cbtn:hover{border-color:var(--text-2)}
.models{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center}
.models .lab{font-size:12px;color:var(--text-2);margin-right:2px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border2);font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap}
.chip.on{color:var(--text);border-color:rgba(91,140,255,.6);background:rgba(91,140,255,.12)}
.chip.ag{color:var(--text-2)}
.chip.sm{color:var(--warn);border-color:rgba(245,196,81,.45)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.msg{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg .mh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);font-weight:500}
.msg .mh .who{color:var(--text);font-weight:600}
.msg.user .mh .who{color:var(--accent)}
.msg .mh .t{margin-left:auto}
.msg .body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .body{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--border)}
.msg .surf{display:flex;flex-direction:column;gap:8px;min-width:0}
.receipts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.receipts .lab{font-size:12px;color:var(--text-2)}
.thinking{font-size:14px;color:var(--text-2)}
.thinking::after{content:"…";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.sugg button{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border2);font-size:13px;color:var(--text)}
.sugg button:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:12px 16px 16px}
.composer input[type=text]{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:9px;border:1px solid var(--border2);background:var(--panel);font-size:15px}
.composer input[type=text]:focus{outline:none;border-color:var(--accent)}
.composer .btn{height:42px}
#clip{width:42px;padding:0;font-size:20px;font-weight:500}
.hist{position:absolute;inset:0;background:var(--bg);z-index:3;display:none;flex-direction:column}
.chat.show-hist .hist{display:flex}
.hist-list{overflow:auto;flex:1}
.sess{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border)}
.sess:hover{background:var(--panel)}
.sess.cur{box-shadow:inset 3px 0 var(--accent)}
.sess b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess span{font-size:12px;color:var(--text-2)}
.empty{padding:16px;color:var(--text-2);font-size:14px}
.chat.dragging::after{content:"Drop a file to extract claims";position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:rgba(11,13,16,.9);font-weight:600;z-index:4}

/* A2UI catalog */
.a-card{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:14px;min-width:0}
.a-card.tone-green{border-color:rgba(61,220,151,.45)}.a-card.tone-amber,.a-card.tone-gold{border-color:rgba(245,196,81,.45)}.a-card.tone-red{border-color:rgba(255,107,107,.5)}.a-card.tone-blue{border-color:rgba(91,140,255,.5)}
.a-card .a-card{background:var(--bg)}
.tone-green{--tone:var(--ok)}.tone-gold,.tone-amber{--tone:var(--warn)}.tone-blue{--tone:var(--accent)}.tone-red{--tone:var(--bad)}.tone-violet,.tone-coral{--tone:var(--text-2)}
.a-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.a-row{display:flex;gap:12px;align-items:center;min-width:0;flex-wrap:wrap}
.a-row.top{align-items:flex-start}.a-row.grid>*{flex:1 1 80px}.a-row.split{justify-content:space-between}.a-row.split>.a-col{flex:1 1 160px}
.a-text{min-width:0;overflow-wrap:anywhere}
.v-h1{font-size:20px;font-weight:600}.v-h2{font-size:17px;font-weight:600}.v-h3{font-size:16px;font-weight:600}.v-h4{font-size:15px;font-weight:600}
.v-body{color:var(--text);font-size:14px}.v-caption{color:var(--text-2);font-size:13px}
.v-label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.v-mono{font:400 13px var(--mono);color:var(--text-2)}
.a-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);font-size:14px;font-weight:600;color:var(--text)}
.a-btn .a-text{color:inherit;font:inherit}
.a-btn.primary{background:var(--accent);color:#0B0D10;border-color:var(--accent)}
.a-btn.danger{border-color:rgba(255,107,107,.55);color:var(--bad)}
.a-btn:disabled{background:var(--panel2);color:var(--text-2);border-color:var(--border2)}
.a-metric{display:flex;flex-direction:column;gap:2px;min-width:0}
.a-metric .val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tone,var(--text))}
.a-metric .val small{font-size:13px;color:var(--text-2);margin-left:3px}
.a-metric .ml{font-size:12px;color:var(--text-2)}
.a-prog{display:flex;flex-direction:column;gap:6px;min-width:0}
.a-prog .pt{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)}
.a-prog .bar{height:6px;margin:0}.a-prog .bar i{width:0;background:var(--tone,var(--accent))}
.a-badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--tone,var(--border2));font-size:12px;font-weight:600;color:var(--tone,var(--text-2));white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none}
.a-div{height:1px;background:var(--border);border:0;width:100%}
.a-code{display:flex;flex-direction:column;gap:4px;min-width:0}
.a-code .cl{font-size:12px;font-weight:600;color:var(--text-2)}

const vScore = v => +(v.heldout_equivalence ?? v.equivalence ?? 0);
